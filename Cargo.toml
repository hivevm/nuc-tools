[package]
name = "nuc-tools"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hivevm/nuc-tools"
description = "The mechanics of the NUC template as one binary: checks, sensors, git hooks, and migrations"
publish = false

# The rules are a functional core in the library; every effect is in src/shell/, and the binary
# only calls into it (ADR-0025).
[lib]
name = "nuc"
path = "src/lib.rs"

[[bin]]
name = "nuc"
path = "src/main.rs"

# Maintainability sensors of the toolchain (ADR-0008): clippy's size and complexity
# lints are errors, and every warning, rustc's dead_code among them, fails under -D warnings.
[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = true
