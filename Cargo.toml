[package]
name = "nuc-tools"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hivevm/nuc-tools"
description = "The mechanics of the NUC template as one binary: checks, sensors, git hooks, and migrations"
publish = false

# The rules are a functional core in the library; every effect is in src/shell/, and the binary
# only calls into it (ARCH-rules-outcome-hooks-answer).
[lib]
name = "nuc"
path = "src/lib.rs"

[[bin]]
name = "nuc"
path = "src/main.rs"

# Maintainability sensors of the toolchain (OPS-rust-stable-behind-scripts): clippy's size and
# complexity lints are errors, and every warning, rustc's dead_code among them, fails under -D
# warnings.
[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = true

[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
