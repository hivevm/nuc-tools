# What cargo deny allows (OPS-rust-stable-behind-scripts, Q-3). scripts/check-deps.sh runs 'cargo
# deny check' against this file. An ignored advisory names its reason beside its id.

[graph]
all-features = true

[advisories]
# Every advisory of the RustSec database fails the check, unmaintained and unsound crates
# included; nothing is ignored.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates that would bring a second way to reach git than its CLI (constraints of the
# specification, SEC-git-cleared-environment).
deny = [
  { crate = "git2", reason = "git is reached only through its CLI" },
  { crate = "gix", reason = "git is reached only through its CLI" },
]

[licenses]
# MIT and the permissive licenses compatible with it, no copyleft (OPS-crates-pass-deny-and-audit);
# a crate that offers MIT among its licenses is taken under MIT.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
