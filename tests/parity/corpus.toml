[[repository]]
name = "nuc-v0-9-1"
url = "https://github.com/hivevm/nuc.git"
commit = "0a19dabc467be930c838cae7a3b3df24320397e5"

# The template at the commit of its release v0.10.0, whose check-docs.sh holds the release line to
