# The corpus of the parity harness (ADR-0022), read by
# scripts/check-parity.sh: each repository by URL and commit, on template release v0.5.0 or later,
# run with the bash checks it carries and with nuc. A pull request moves a pin. The format is one
# '[[repository]]' table per entry with the three keys below, each a string on a line of its own.

# The template at the commit of its release v0.5.0.
[[repository]]
name = "nuc"
url = "https://github.com/hivevm/nuc.git"
commit = "1bc9c65fe48e893aaf4e3b49f1bc803c0c753a98"

# The template at the commit of its release v0.6.0, where check 8 flips an old ADR on the
# acceptance of its successor: the rules that check by the release check it as v0.6.0.
[[repository]]
name = "nuc-v0-6-0"
url = "https://github.com/hivevm/nuc.git"
commit = "f9d3c56b9bc238c975ee4d1b4f5a9bb4cfdc8f33"

# The template at the commit of its release v0.6.1, whose check-docs.sh ends the template's name
# in a badge, so that a derived repository named after it keeps its own badges.
[[repository]]
name = "nuc-v0-6-1"
url = "https://github.com/hivevm/nuc.git"
commit = "1f5a07c7e1959a52e45ff249a07db7c32bf4939c"

# A derived repository on template release v0.6.1, at a fixed commit of its main.
[[repository]]
name = "nectar"
url = "https://github.com/hivevm/nectar.git"
commit = "4892160534f5b8f22dd51b980b7275429c9ef9d0"

# This repository on template release v0.6.1, at a fixed commit of its main after the port of
# check-traceability.sh.
[[repository]]
name = "nuc-tools"
url = "https://github.com/hivevm/nuc-tools.git"
commit = "45ecc27797fbd284853a6d38c2cef52c8522a054"

# A derived repository on template release v0.6.0, at a fixed commit of its main.
[[repository]]
name = "ocelli"
url = "https://github.com/hivevm/ocelli.git"
commit = "5d6e15722f8a9627a832c0062933282dfeb36261"

# A derived repository on template release v0.6.1, at a fixed commit of its main.
[[repository]]
name = "opamp-fleet"
