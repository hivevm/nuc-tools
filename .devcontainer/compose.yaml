# The development observability stack, as a Compose project of its own: OTLP in, Grafana out.
#
#   traces  ─┐
#   metrics ─┼─▶ OpenTelemetry Collector ──▶ ClickHouse ──▶ Grafana
#   logs    ─┘
#
# One store instead of Tempo + Prometheus + Loki: one query language for all three signals, one
# place to retain and delete, and joins *across* signals that three separate stores cannot do at
# all. What it costs is named in README.md — read it before assuming this is strictly better.
#
# Nothing shipped depends on it. It exists so own telemetry can be looked at while working, and it
# runs on the *host*, apart from the Dev Container: start it when you want it, from this directory
# or with `-f .devcontainer/compose.yaml`. The Dev Container reaches the Collector through the host
# (README.md → "Reaching it from the Dev Container"); it needs no Docker socket for that.
#
# Every relative path below resolves against this file's directory, the Compose project directory.
# The bind mounts carry `z`: on an SELinux host (Fedora, RHEL) a file mounted without it is
# unreadable inside the container, and nothing says so — Grafana comes up with no datasource and
# no dashboards, and the Collector without its configuration. Docker and hosts without SELinux
# ignore the option.
#
# Ports published on the host, on OBSERVABILITY_BIND (default 127.0.0.1 — the loopback only, since
# the store holds personal data; README.md → "Start"): 4317 OTLP/gRPC, 4318 OTLP/HTTP, 3001 Grafana,
# 8123 ClickHouse HTTP. The Collector and Grafana reach ClickHouse's native port on the Compose
# network, so it is not published.

name: claude-code

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.10.3.7
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
    # ClickHouse opens a lot of files; below this it refuses to start on many hosts.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - data-clickhouse:/var/lib/clickhouse
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:8123:8123" # HTTP — what `curl` and README.md's checks use
    healthcheck:
      # The client is in the image, so this needs no extra tool and tests the thing that matters:
      # that the server answers a query as the user the Collector will connect as.
      test: [ "CMD", "clickhouse-client", "--user", "otel", "--password", "otel", "--query", "SELECT 1" ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro,z
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:4317:4317" # OTLP/gRPC
      - "${OBSERVABILITY_BIND:-127.0.0.1}:4318:4318" # OTLP/HTTP
    depends_on:
      clickhouse:
        # Not `service_started`: the exporter creates its tables on the first batch, and a
        # ClickHouse that is still opening its databases fails that in a way the retry can outlive.
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      # Not Grafana's default 3000. Set on Grafana itself rather than only on the host side, so
      # `grafana:3001` inside the Compose network and `localhost:3001` on the host are one port.
      GF_SERVER_HTTP_PORT: "3001"
      # Anyone who reaches the port may look; editing takes the login admin/admin, which Grafana
      # asks to change on the first sign-in.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # The ClickHouse datasource is not built in. `_SYNC` because the plugin has to be on disk
      # before Grafana reads the provisioning below — the async variant races it. Unpinned on
      # purpose: Grafana resolves the newest version compatible with itself, and a pin here goes
      # stale against the image above. To pin, append it: "grafana-clickhouse-datasource@4.23.4".
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      # Opens straight on the overview instead of Grafana's welcome page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - data-grafana:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  data-clickhouse:
  data-grafana:
