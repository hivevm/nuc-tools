# Keeps the dependencies current as pull requests (ADR-0015): the
# GitHub Actions under .github/workflows/, pinned by commit SHA, get a pull request that moves the
# pin and its version comment; the crates of Cargo.lock get one that scripts/check-deps.sh audits.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
