name: Checks

# Enforces the repository's rules as CI. The checks are bash + coreutils, and only the build,
# portability, deps, parity, and shell jobs install something, and nuc where a job runs a git hook.
# The shell job installs the ShellCheck that .devcontainer/install-shellcheck.sh pins, the one the
# Dev Container lints with, in place of the runner image's own, whose version moves with the image.
# The git hooks hand their work to a released nuc, which each job that runs a hook installs first
# by release/install-nuc.sh from release/gate/, never a build of this tree
# (SEC-gates-run-released-nuc).
# scripts/check-all.sh is the local equivalent; the rule docs/check-lists of scripts/check-docs.sh
# holds its list, the jobs of this workflow, and the required checks named in CONTRIBUTING.md
# together. Each job runs a check after its own self-test, and each script's header says what it
# checks and which ADR it holds.
#
# The sensors report for the reviewer and fail on nothing they count, except the plain rules,
# which this workflow runs with --require, and the action references, which this project checks
# with --require sha (SEC-actions-pinned-by-sha); their self-tests fail like any check's. The
# sensors job checks out the full history because five sensors read it. The review binding sensor
# runs in review-binding.yml, the repository settings sensor on a human's instruction
# (NUC-checks-are-bash §7); this workflow runs the self-test of each.
#
# The build job runs the toolchain's build, test, and lint, and the deps job the dependency audit
# (OPS-rust-stable-behind-scripts); the parity job builds nuc for the parity harness
# (TEST-parity-harness). The portability job runs the same build on Linux arm64, macOS, and
# Windows, each a required check run (Q-4, OPS-rust-stable-behind-scripts).
#
# Every job is bounded by a timeout — a hung step would otherwise occupy a runner until the
# platform's own six-hour limit — and every checkout runs with 'persist-credentials: false': the
# workflow token is needed to fetch the code, not afterwards, and leaving it in .git/config makes
# it readable to every later step and to anything they invoke.

on:
  pull_request:
  push:
    branches: [main]
  # Started by hand on a pushed branch that has no pull request yet, such as a feat/ branch
  # under rework (NUC-main-only-via-pr §5): gh workflow run checks.yml --ref <branch>. GitHub
  # offers it only once this trigger is on the default branch.
  workflow_dispatch:
  # Once a week against main without a change: catches what moves without a commit, the runner
  # image, a retagged action, a toolchain download. GitHub disables a schedule after 60 days
  # without activity in a public repository.
  schedule:
    - cron: "17 5 * * 1"

# Each job names the permissions it needs; the workflow grants none (SEC-no-stored-secrets).
permissions: {}

# Cancel a pull request's superseded runs: a new push makes the previous run's verdict irrelevant,
# while a queued run keeps a required check pending. Runs on 'main' are never cancelled — every
# commit there keeps a result of its own, and the event name keeps a scheduled run out of the group
# of the pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Submodules are checked out because the link check resolves relative targets against the
      # working tree: a documentation link into a submodule would otherwise break in CI while
      # working locally. Their *contents* are never read — check-docs.sh enumerates via
      # `git ls-files`, which lists a submodule as one gitlink entry, not as its files. The whole
      # history is fetched: the rule docs/adr-identifiers reads the identifiers of deleted ADRs
      # off it, and the rule docs/template-release the release line at the merge base with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Install the released nuc, which the git hooks hand their work to
        run: |
          sh release/install-nuc.sh release/gate/SHA256SUMS release/gate/VERSION "$RUNNER_TEMP/nuc-bin"
          echo "$RUNNER_TEMP/nuc-bin" >> "$GITHUB_PATH"
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the documentation checks
        run: bash scripts/test-check-docs.sh
      - name: Check documentation consistency
        run: bash scripts/check-docs.sh
      - name: Self-test the comment width check
        run: bash scripts/test-check-comment-width.sh
      - name: Check that every comment line of the project's own code is at most 100 columns
        run: bash scripts/check-comment-width.sh
      - name: Self-test the accepted ADR text check
        run: bash scripts/test-check-adr-text.sh
      - name: Check that each commit changes an accepted ADR only in its Status and Date lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-adr-text.sh "$BASE"
      - name: Self-test the map script of the normalize skill
        run: bash scripts/test-normalize-remap.sh
      - name: Self-test the readiness script of the pull request into main
        run: bash scripts/test-ready-for-main.sh
      - name: Self-test the drop script of a merged branch
        run: bash scripts/test-drop-merged-branch.sh

  traceability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the traceability check
        run: bash scripts/test-check-traceability.sh
      - name: Check that accepted decisions and criteria are verified by tests
        run: bash scripts/check-traceability.sh

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the Dev Container check
        run: bash scripts/test-check-devcontainer.sh
      - name: Check that the Dev Container keeps the host engine out of reach
        run: bash scripts/check-devcontainer.sh
      - name: Self-test the gh wrapper of the Dev Container
        run: bash scripts/test-gh-host-login.sh
      - name: Self-test the dashboard check
        run: bash scripts/test-check-dashboards.sh
      - name: Check that every dashboard panel filters by project and session on the whole name
        run: bash scripts/check-dashboards.sh
      - name: Self-test the Compose check
        run: bash scripts/test-check-compose.sh
      - name: Check that every port of a development stack is published on a named host address
        run: bash scripts/check-compose.sh

  sensors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The sensor's own tests run first: a sensor that is wrong reports nothing worth reading.
      - name: Self-test the tests-kept sensor
        run: bash scripts/test-sensor-tests-kept.sh
      # The base is the pull request's base branch, or the previous tip on a push to main.
      - name: Report test files deleted and skip markers added since the base
        run: bash scripts/sensor-tests-kept.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the binding ADRs sensor
        run: bash scripts/test-sensor-binding-adrs.sh
      - name: Report the ADRs in force whose Applies to names a path the change touches
        run: bash scripts/sensor-binding-adrs.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the plain rules sensor
        run: bash scripts/test-sensor-plain-rules.sh
      - name: Check the rules the change adds to a project ADR, and report the rest
        run: bash scripts/sensor-plain-rules.sh --require "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Self-test the revision-due sensor
        run: bash scripts/test-sensor-revision-due.sh
      - name: Report the changes since the last design revision
        run: bash scripts/sensor-revision-due.sh
      - name: Self-test the plan frontier sensor
        run: bash scripts/test-sensor-plan-frontier.sh
      - name: Report the tickets that may be claimed, the claimed, and the blocked
        run: bash scripts/sensor-plan-frontier.sh
      - name: Self-test the backlog sensor
        run: bash scripts/test-sensor-backlog.sh
      - name: Report the backlog entries on main and on unmerged local branches
        run: bash scripts/sensor-backlog.sh
      - name: Self-test the action references sensor
        run: bash scripts/test-sensor-action-refs.sh
      # The decided form of the action references, a commit SHA with its version comment.
      # Verifies: SEC-actions-pinned-by-sha
      - name: Check that every action is referenced by commit SHA
        run: bash scripts/sensor-action-refs.sh --require sha
      - name: Self-test the review binding sensor
        run: bash scripts/test-sensor-review-binding.sh
      # The repository settings sensor itself runs on a human's instruction
      # (NUC-checks-are-bash §7).
      - name: Self-test the repository settings sensor
        run: bash scripts/test-sensor-repo-settings.sh
      # The work measures sensor itself runs on a human's instruction (NUC-checks-are-bash §7).
      - name: Self-test the work measures sensor
        run: bash scripts/test-sensor-work-measures.sh
      # The release notes sensor itself runs on a human's instruction (NUC-checks-are-bash §7).
      - name: Self-test the release notes sensor
        run: bash scripts/test-sensor-release-notes.sh
      # The red commits sensor itself runs on a human's instruction, for its cost.
      - name: Self-test the red commits sensor
        run: bash scripts/test-sensor-red-commits.sh

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the released nuc, which the git hooks hand their work to
        run: |
          sh release/install-nuc.sh release/gate/SHA256SUMS release/gate/VERSION "$RUNNER_TEMP/nuc-bin"
          echo "$RUNNER_TEMP/nuc-bin" >> "$GITHUB_PATH"
      - name: Self-test the check runner
        run: bash scripts/test-check-all.sh
      - name: Self-test the git hooks
        run: bash scripts/test-git-hooks.sh
      # The pinned ShellCheck goes on PATH before anything lints, the lint's self-test included.
      - name: Self-test the ShellCheck install
        run: bash scripts/test-install-shellcheck.sh
      - name: Install the pinned ShellCheck
        run: |
          bash .devcontainer/install-shellcheck.sh "$RUNNER_TEMP/shellcheck"
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
      - name: Check the ShellCheck version
        run: bash .devcontainer/install-shellcheck.sh --verify
      - name: Self-test the pin check of the git hooks
        run: bash scripts/test-check-hooks.sh
      - name: Check that the git hooks are the pinned shims and nuc.toml runs their rules
        run: bash scripts/check-hooks.sh
      - name: Self-test the shell lint
        run: bash scripts/test-check-shell.sh
      - name: Lint shell scripts with ShellCheck
        run: bash scripts/check-shell.sh

  # The rules of the gates themselves: the workflows store no secret and set permissions per job
  # (SEC-no-stored-secrets), and no gate runs a build of the working tree
  # (SEC-gates-run-released-nuc).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The check's own tests run first: a check that is wrong passes nothing worth trusting.
      - name: Self-test the workflow credentials check
        run: bash scripts/test-check-workflows.sh
      - name: Check that the workflows use no stored secret and set permissions per job
        run: bash scripts/check-workflows.sh
      - name: Self-test the macOS floor check
        run: bash scripts/test-check-macos-floor.sh
      - name: Check that no step of a macOS job runs a script behind the bash floor
        run: bash scripts/check-macos-floor.sh
      - name: Self-test the gates check
        run: bash scripts/test-check-gates.sh
      - name: Check that no gate runs a build of the working tree
        run: bash scripts/check-gates.sh

  # The toolchain's job (OPS-rust-stable-behind-scripts): the runner image ships rustup, which
  # installs the toolchain rust-toolchain.toml pins on the first cargo call.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test of Q-11 in tests/isolation.rs runs nuc in a network namespace of its own, which
      # the Ubuntu runner lets an unprivileged user make only with this restriction lifted.
      - name: Allow the network namespace of the test without network
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Format, lint, build, and test
        run: bash scripts/check-build.sh
      # The release tooling under release/, with stub binaries; release-test.yml builds the real
      # ones (OPS-feature-in-hivevm-features).
      - name: Self-test the release tooling
        run: bash scripts/test-release.sh

  # The build of the build job on the other platforms of Q-4, one required check run per entry of
  # the matrix (OPS-rust-stable-behind-scripts); fail-fast is off so that one red platform
  # does not hide another. The runner images ship rustup, which installs the toolchain
  # rust-toolchain.toml pins; on Windows the script runs in the Git Bash the image ships.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test of Q-11 in tests/isolation.rs runs nuc in a network namespace of its own, which
      # the Ubuntu runner lets an unprivileged user make only with this restriction lifted.
      - name: Allow the network namespace of the test without network
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Format, lint, build, and test
        shell: bash
        run: bash scripts/check-build.sh

  # The dependency audit (OPS-rust-stable-behind-scripts, Q-3): both tools are built from crates.io
  # at the versions named here and fetch the RustSec advisory database.
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: Audit the dependencies
        run: bash scripts/check-deps.sh

  # The parity harness (TEST-parity-harness, Q-2): the bash checks of each repository of the
  # corpus and nuc on the same tree, any difference a failure. It fetches the corpus and builds nuc
  # with the toolchain rust-toolchain.toml pins; Linux only. Its comparisons are bound by the
  # processor, about 18 minutes on one runner, so each entry of the matrix makes one shard of them,
  # one required check run per entry; together they compare every tree once. The last shard also
  # runs the parts that read all the template's trees, the hook scenarios among them, and the
  # first runs the self-tests, by its place in the matrix, so that they run whatever its values.
  # fail-fast is off so that one red shard does not hide another.
  parity:
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The harness's own tests run first: a harness that is wrong passes nothing worth trusting.
      - name: Self-test the parity harness
        if: strategy.job-index == 0
        run: bash scripts/test-check-parity.sh
      - name: Compare the bash checks and nuc on the corpus
        run: bash scripts/check-parity.sh --shard "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      # The benchmark of Q-5 runs in benchmark.yml on a schedule; its self-test, which no timing
      # decides, runs here with the other tests of the hooks' port.
      - name: Self-test the hook latency benchmark
        if: strategy.job-index == 0
        run: bash scripts/test-bench-hook-latency.sh
