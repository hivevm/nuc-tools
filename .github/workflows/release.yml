name: Release

# Builds, attests, and publishes a release when a human pushes a tag vX.Y.Z
# (ADR-draft-distribution). The build job builds one binary per target with release/build.sh; the
# publish job writes SHA256SUMS, attests every binary, creates the GitHub Release, verifies the
# attestations it published, and writes the release commit: release/pin.sh puts the checksums and
# the version into the Action and the Feature, the commit is tagged pinned/vX.Y.Z so that it stays
# reachable, and the major tag vN moves to it. The feature job publishes the Feature from that
# commit. The tag vX.Y.Z keeps naming the source commit the attestations name.
#
# The workflow uses no stored secret, only the workflow token and its OIDC token, each job with
# the permissions it names (ADR-draft-no-stored-secrets). release-test.yml tests what this
# workflow runs on every pull request that changes it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# One release at a time; a second tag waits instead of moving the major tag under the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tooling's own tests run first: a tool that is wrong publishes nothing worth
      # trusting.
      - name: Self-test the release tooling
        shell: bash
        run: bash scripts/test-release.sh
      - name: Build the release binary
        shell: bash
        run: bash release/build.sh "$TARGET" dist
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release, the release commit, and its tags
      id-token: write # the OIDC token of the attestations
      attestations: write
    outputs:
      pinned: ${{ steps.pin.outputs.pinned }}
    steps:
      # The credentials stay in .git/config in this job only: it pushes the release commit's tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the release tooling
        run: bash scripts/test-release.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuc-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: bash release/sums.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nuc-*
      - name: Publish the release
        run: gh release create "$TAG" dist/nuc-* dist/SHA256SUMS --verify-tag --title "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - name: Verify the attestation of every published binary
        run: |
          for binary in dist/nuc-*; do
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write the release commit and move the major tag to it
        id: pin
        run: |
          version="${TAG#v}"
          bash release/pin.sh "$version" dist/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/pinned feature/src/nuc
          git commit -q -m "chore(release): pin $TAG into the Action and the Feature"
          git tag "pinned/$TAG"
          git tag -f "v${version%%.*}"
          git push origin "refs/tags/pinned/$TAG"
          git push -f origin "refs/tags/v${version%%.*}"
          echo "pinned=pinned/$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

  feature:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # ghcr.io/hivevm/nuc-tools/nuc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.pinned }}
          persist-credentials: false
      - name: Self-test the release tooling
        run: bash scripts/test-release.sh
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./feature/src
          generate-docs: "false"
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}
