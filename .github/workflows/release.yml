name: Release

# Builds, attests, and publishes a release when a human pushes a tag vX.Y.Z
# (ADR-0014). release/version.sh first refuses a tag that is not the version of
# Cargo.toml. The build job builds one binary per target with release/build.sh. The publish job
# writes SHA256SUMS, attests every binary and verifies that this workflow signed each attestation,
# creates the GitHub Release as a draft, and writes the release commit: release/pin.sh puts the
# checksums and the version into the Action and the Feature, the commit is tagged pinned/vX.Y.Z so
# that it stays reachable, and release/move-major.sh moves the major tag vN to it unless vN names a
# later release. Only then is the release made public. The feature job publishes the Feature from
# the release commit. The tag vX.Y.Z keeps naming the source commit the attestations name.
#
# The workflow uses no stored secret, only the workflow token and its OIDC token, each job with
# the permissions it names (ADR-0016); no checkout keeps its credentials, and
# the two tag pushes pass the token as a header of their own. Two releases may run at once: the
# push of the major tag leases on what it named, so a release that moved it meanwhile is not
# overwritten; a concurrency group would drop every pending run but the latest.
# release-test.yml tests what this workflow runs on every pull request that changes it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release tooling's own tests run first: a tool that is wrong publishes nothing worth
      # trusting.
      - name: Self-test the release tooling
        shell: bash
        run: bash scripts/test-release.sh
      - name: Check that the tag names the version of the crate
        shell: bash
        run: bash release/version.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Build the release binary
        shell: bash
        run: bash release/build.sh "$TARGET" dist
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuc-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release, the release commit, and its tags
      id-token: write # the OIDC token of the attestations
      attestations: write
    outputs:
      pinned: ${{ steps.pin.outputs.pinned }}
    steps:
      # The full history and the tags: release/move-major.sh reads what the major tag names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test the release tooling
        run: bash scripts/test-release.sh
      - name: Check that the tag names the version of the crate
        run: bash release/version.sh "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuc-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: bash release/sums.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nuc-*
      # Before anything is published: each binary carries an attestation signed by this workflow.
      - name: Verify the attestation of every binary
        run: |
          for binary in dist/nuc-*; do
            gh attestation verify "$binary" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      # A draft until the release commit and its tags are pushed: a failure on the way leaves no
      # public release without the Action and the Feature that install it.
      - name: Create the release as a draft
        run: gh release create "$TAG" dist/nuc-* dist/SHA256SUMS --draft --verify-tag --title "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - name: Write the release commit and push its tags
        id: pin
        run: |
          version="${TAG#v}"
          major="v${version%%.*}"
          bash release/pin.sh "$version" dist/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/pinned feature/src/nuc
          git commit -q -m "chore(release): pin $TAG into the Action and the Feature"
          git tag "pinned/$TAG"
          result="$(bash release/move-major.sh "$version")"
          # The token reaches git as a header of these two pushes only, never .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          push() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "$@"; }
          push origin "refs/tags/pinned/$TAG"
          if [[ "$result" == moved* ]]; then
            # The lease refuses the push when another release moved the major tag meanwhile.
            push --force-with-lease="refs/tags/$major:${result#moved }" origin "refs/tags/$major"
          fi
          echo "pinned=pinned/$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  feature:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # ghcr.io/hivevm/nuc-tools/nuc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.pinned }}
          persist-credentials: false
      - name: Self-test the release tooling
        run: bash scripts/test-release.sh
      # The CLI the action installs from npm is pinned too; its default is the latest version.
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: ./feature/src
          generate-docs: "false"
          disable-repo-tagging: "true"
          devcontainer-cli-version: "0.89.0"
        env:
          GITHUB_TOKEN: ${{ github.token }}
